name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saude_plena
          POSTGRES_PASSWORD: saude_plena
          POSTGRES_DB: saude_plena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saude_plena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco isolado do service container — nunca o de desenvolvimento.
      DATABASE_URL: postgresql://saude_plena:saude_plena@localhost:5432/saude_plena_test?schema=public
      # Segredo só de teste (o CI não guarda sessão real nenhuma); produção usa
      # um valor próprio, configurado no Render.
      SESSION_SECRET: segredo-apenas-para-testes-do-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      # `prisma` é peer dependency opcional de @prisma/client: um `npm audit
      # --omit=dev` isolado ainda o conta (e a árvore dele tem 3 altas via
      # deepmerge-ts). O deploy real usa `npm ci --omit=dev --omit=optional`
      # (ver docker-compose/README de deploy), então auditamos com as mesmas
      # flags para refletir o que realmente vai pra produção.
      - run: npm audit --omit=dev --omit=optional

      # Aplica as migrações commitadas no banco de teste do service container
      # (sempre começa vazio — não precisa de reset explícito).
      - run: npx prisma migrate deploy
      - run: npm test
