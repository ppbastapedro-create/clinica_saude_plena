<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saúde Plena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Fica oculto até o app.js confirmar a sessão em /auth/me: sem login,
       nem a estrutura do sistema aparece (vai direto para o login). -->
  <div class="sistema" id="sistema" hidden>
    <aside class="lateral">
      <a class="marca" href="#/agenda">
        <span class="marca-logo">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </span>
        Saúde Plena
      </a>

      <nav class="menu" aria-label="Menu principal">
        <a href="#/agenda" data-menu="agenda">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          Agenda
        </a>
        <a href="#/pacientes" data-menu="pacientes">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8z"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Pacientes
        </a>
        <a href="#/financeiro" data-menu="financeiro">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Financeiro
        </a>
      </nav>

      <div class="usuario">
        <span class="avatar" id="usuario-iniciais"></span>
        <div class="usuario-dados">
          <strong id="usuario-nome"></strong>
          <span id="usuario-email"></span>
        </div>
        <button class="botao-sair" id="botao-sair" type="button" title="Sair" aria-label="Sair">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <!-- type="module": os arquivos de js/ usam import/export. Continua em
       arquivo separado (o Helmet/CSP bloqueia <script> inline). -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
